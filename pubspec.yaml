name: genotp_flutter
description: "TOTP/HOTP one-time password plugin for Flutter, powered by genotp-go via gomobile. Works on Android and iOS with no network dependency."
version: 0.0.3
homepage: https://github.com/robby031/genotp-flutter
repository: https://github.com/robby031/genotp-flutter
issue_tracker: https://github.com/robby031/genotp-flutter/issues

environment:
  sdk: ^3.12.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.robby031.genotp_flutter
        pluginClass: GenotpFlutterPlugin
      ios:
        pluginClass: GenotpFlutterPlugin
